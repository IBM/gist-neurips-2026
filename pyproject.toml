[project]
name = "gist"
version = "0.1.0"
description = "GIST: Gauge-Invariant Spectral Transformers for scalable graph neural operators"
authors = [{ name = "Mattia Rigotti" }, { name = "Nicholas Thumiger" }, { name = "Thomas Frick" }]
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "einops>=0.8",
    "pyyaml>=6.0",
    "scipy>=1.13",
    "torch==2.14.*",
    "torch-geometric==2.8.*",
]

[project.optional-dependencies]
mesh = ["pyvista>=0.46"]
ogb = ["ogb>=1.3.6"]
tensorboard = ["tensorboard>=2.17"]

[dependency-groups]
dev = [
    "mypy>=1.10",
    "pytest>=8.0",
    "ruff>=0.9",
    "types-pyyaml",
]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["gist*"]

[tool.mypy]
files = ["gist"]
disallow_untyped_defs = true
no_implicit_optional = true
check_untyped_defs = true
warn_return_any = true
warn_unused_ignores = true
show_error_codes = true

[[tool.mypy.overrides]]
module = ["torch_geometric.*", "pyvista.*", "ogb.*", "scipy.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["B", "C4", "E", "F", "I", "SIM", "UP", "W", "RUF"]
ignore = ["E501"]
