# Replicates the paper's ogbn-arxiv result; procedure in the README.
# Expected: test accuracy 72.31 ± 0.29% (mean ± std over 6 seeds). 6.22M parameters.
dataset: ogbn-arxiv
seeds:
- 0
- 1
- 2
- 3
- 4
- 5
embedding:
  embed_dim: 512
  deg: 256
model:
  hidden_dim: 256
  num_layers: 2
  num_heads: 4
  mlp_ratio: 2
  dropout: 0.7
  spectral_threshold: 1.0
train:
  lr: 0.002
  weight_decay: 0.0
  epochs: 1000
  warmup_epochs: 10
  batch_size: 1
  final_training: true
